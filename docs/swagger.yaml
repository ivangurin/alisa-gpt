  title: alisa-gpt
  version: "1.0"
paths:
  /:
    post:
      consumes:
      - application/json
      description: 'Единственная ручка навыка: принимает запрос вебхука Яндекс.Диалогов
        (протокол v1.0), зовёт ChatGPT и возвращает ответ для озвучивания. Ошибки
        LLM не роняют сессию — навык отвечает fallback-фразой.'
      parameters:
      - description: Запрос вебхука Алисы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/alisa-gpt_internal_models.AliceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alisa-gpt_internal_models.AliceResponse'
        "400":
          description: Битный JSON запроса
          schema:
            $ref: '#/definitions/alisa-gpt_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/alisa-gpt_internal_models.ErrorResponse'
      summary: Handle Alice webhook
      tags:
      - alisa
  /healthcheck:
